<div class="container" style="padding-top: 1.5rem;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 position-relative pb-2 fw-bold" style="color: #2c3e50;">
            قائمة الحضور
            <span style="
        position: absolute;
        bottom: 0;
        right: 0;
        width: 50%;
        height: 3px;
        background: linear-gradient(to right, #3498db, #2ecc71);
        border-radius: 3px;
      "></span>
        </h4>
    </div>

    <!-- Attendance form when not taken -->
    <div *ngIf="statusObject?.attendanceTaken === false  && statusObject.students.length > 0"
        class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    تسجيل الحضور
                </div>
                <div class="card-body">
                    <form (ngSubmit)="submitAttendance()">
                        <div class="form-check d-flex justify-content-between align-items-center mb-3 p-3 rounded border student-row"
                            *ngFor="let student of statusObject?.students" style="cursor: pointer;">
                            <label
                                class="form-check-label flex-grow-1 text-end m-0 d-flex justify-content-between align-items-center"
                                style="user-select: none;">
                                {{ student.student.name }}

                                <input type="checkbox" class="form-check-input ms-3" [(ngModel)]="student.isPresent"
                                    [name]="'student_' + student.student.id" style="width: 1.25rem; height: 1.25rem;" />
                            </label>
                        </div>
                        <div class="text-start mt-3">
                            <button class="btn btn-primary" type="submit">حفظ الحضور</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Attendance list when taken -->
    <div *ngIf="statusObject?.attendanceTaken === true" class="row">
        <div class="col-lg-12">
            <div>
                <div class="table-responsive">
                    <table class="table project-list-table table-nowrap align-middle table-borderless">
                        <thead>
                            <tr>
                                <th scope="col" class="ps-4">اسم الطالب</th>
                                <th scope="col" style="width: 100px;">الحالة</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let attendance of statusObject?.attendanceList" style="cursor: default;">
                                <td class="ps-4" data-label="اسم الطالب">
                                    {{ attendance?.student.name }}
                                </td>
                                <td class="text-center" data-label="الحالة">
                                    <span *ngIf="!attendance.isPresent; else presentIcon"
                                        class="badge-soft-danger rounded-pill py-1 px-2" title="غائب"
                                        style="font-size: 1.3rem;"><i class="bx bx-x-circle"></i></span>
                                    <ng-template #presentIcon>
                                        <span class="badge-soft-success rounded-pill py-1 px-2" title="حاضر"
                                            style="font-size: 1.3rem;"><i class="bx bx-check-circle"></i></span>
                                    </ng-template>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

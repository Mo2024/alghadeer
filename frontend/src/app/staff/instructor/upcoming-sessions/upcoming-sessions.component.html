<div class="container" style="padding-top: 1.5rem;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 position-relative pb-2 fw-bold" style="
        color: #2c3e50;
    ">
            الحصص القادمة
            <span style="
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50%;
            height: 3px;
            background: linear-gradient(to right, #3498db, #2ecc71);
            border-radius: 3px;
        "></span>
        </h4>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="">
                <div class="table-responsive">
                    <table class="table project-list-table table-nowrap align-middle table-borderless">
                        <thead>
                            <tr>
                                <th scope="col" class="ps-4" style="width: 50px;">الرقم</th>
                                <th scope="col">اسم الصف</th>
                                <th scope="col">التاريخ</th>
                                <th scope="col" style="width: 100px;">الموضوع</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let session of upcomingSessions">
                                <td class="ps-4">{{ session.id }}</td>
                                <td><a class="text-body">{{ session.class.name }}</a></td>
                                <td><a class="text-body">{{ session.date }}</a></td>
                                <td><a class="text-body">{{ session.subTopic?.name || 'لم يحدد' }}</a>
                                </td>
                            </tr>

                        </tbody>
                    </table>


                </div>
            </div>
        </div>
    </div>
    <div class="row g-0 align-items-center pb-4" dir="ltr">
        <div class="col-12 text-center">

            <ul class="pagination justify-content-center mb-0 flex-row">

                <li class="page-item" [class.disabled]="page.first">
                    <a class="page-link" (click)="goToPage(page.number - 1)" *ngIf="!page.first">
                        <i class="mdi mdi-chevron-right"></i>
                    </a>
                    <span class="page-link" *ngIf="page.first">
                        <i class="mdi mdi-chevron-right"></i>
                    </span>
                </li>

                <ng-container *ngFor="let p of visiblePages.slice().reverse()">
                    <li class="page-item" [class.active]="p === page.number" *ngIf="p >= 0">
                        <a class="page-link" (click)="goToPage(p)">
                            {{ toArabicNumeral(p + 1) }}
                        </a>
                    </li>

                    <li class="page-item disabled" *ngIf="p === -1">
                        <span class="page-link">...</span>
                    </li>
                </ng-container>



                <li class="page-item" [class.disabled]="page.last">
                    <a class="page-link" (click)="goToPage(page.number + 1)" *ngIf="!page.last">
                        <i class="mdi mdi-chevron-left"></i>
                    </a>
                    <span class="page-link" *ngIf="page.last">
                        <i class="mdi mdi-chevron-left"></i>
                    </span>
                </li>
            </ul>

        </div>
    </div>

</div>

<div class="container" style="padding-top: 1.5rem;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 position-relative pb-2 fw-bold" style="color: #2c3e50;">
            اختبار الصلاة
            <span style="
                position: absolute;
                bottom: 0;
                right: 0;
                width: 50%;
                height: 3px;
                background: linear-gradient(to right, #3498db, #2ecc71);
                border-radius: 3px;
            "></span>
        </h4>
    </div>

    <!-- First form (topics selection) -->
    <form *ngIf="!showQuestions">
        <label *ngIf="subjects.length > 0" class="form-label fw-semibold mb-2">اختر المواضيع</label>
        <label *ngIf="subjects.length == 0" class="form-label fw-semibold mb-2">لا توجد مواضيع لهذا المستوى</label>

        <div *ngFor="let subj of subjects" class="mb-3 d-flex align-items-center">
            <input type="checkbox" [id]="'subject_' + subj.id" [value]="subj.id"
                (change)="onSubjectToggle($event, subj)" name="subject_{{subj.id}}"
                style="width: 18px; height: 18px; margin-left: 10px; cursor: pointer;">

            <label class="fw-semibold" [for]="'subject_' + subj.id" style="cursor: pointer;">
                {{ subj.name }}
            </label>
        </div>

        <button *ngIf="subjects.length > 0" class="btn shadow-sm rounded-3 btn-submit mt-3" (click)="createAttempt()">
            تأكيد
        </button>
    </form>

    <!-- Second form (questions evaluation) -->
    <form *ngIf="showQuestions">
        <div *ngFor="let q of questions" class="mb-3">
            <label class="form-label fw-semibold">{{ q.question.question }}</label>

            <select class="form-select" [(ngModel)]="q.evaluation" name="evaluation_{{q.question.id}}">
                <option [ngValue]="null">التقييم</option>
                <option value="YANSAA_AW_LA_YAALAM">ينسى أو لا يعلم</option>
                <option value="GHAYR_MOTAMAKEN">غير متمكن</option>
                <option value="LA_BAS">لا بأس</option>
                <option value="ITQAN">إتقان</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">ملاحظات المعلم</label>
            <textarea class="form-control" rows="3" [(ngModel)]="studentAttempt.comments" name="comments">
        </textarea>
        </div>

        <!-- Toggle for isPassed -->
        <div class="mb-3 d-flex align-items-center">
            <label class="form-label fw-semibold me-3 mb-0">الطالب ناجح</label>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="isPassed" [(ngModel)]="studentAttempt.isPassed"
                    name="isPassed">
            </div>
        </div>

        <div class="d-flex gap-2 mt-3 mb-4">
            <!-- Submit Button -->
            <button class="btn shadow-sm rounded-3 btn-submit d-flex align-items-center" (click)="submitAttempt()">
                تسليم التقييمات
            </button>

            <!-- Save Button -->
            <button class="btn shadow-sm rounded-3 btn-save d-flex align-items-center" (click)="saveAttempt()">
                حفظ <i class='bx bx-save me-2'></i> <!-- Boxicons save icon -->
            </button>
        </div>

    </form>

</div>

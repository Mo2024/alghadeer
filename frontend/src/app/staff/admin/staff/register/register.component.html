<div class="login-wrapper">
    <form (ngSubmit)="onSubmit()" class="login-form text-center">
        <h2 class="login-title mb-4">إنشاء الحساب</h2>

        <div class="form-group mb-3">
            <input type="text" [(ngModel)]="email" name="email" class="minimalist-input"
                placeholder="البريد الإلكتروني">
        </div>

        <div class="form-group mb-3">
            <input type="text" [(ngModel)]="name" name="name" class="minimalist-input" placeholder="إسم الطاقم">
        </div>

        <div class="form-group mb-4">
            <select class="minimalist-input" [(ngModel)]="role" name="role">
                <option [value]="''">اختر الصلاحية</option>
                <option value="ADMIN">مدير</option>
                <option value="SUPERVISOR">مشرف</option>
                <option value="INSTRUCTOR">معلم</option>
            </select>
        </div>

        <button [disabled]="isDisabled" type="submit" class="btn-login w-75 rounded-pill">إنشاء الحساب</button>
    </form>
</div>

<div class="container py-4" dir="rtl">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 position-relative pb-2 fw-bold" style="color: #34495e;">
            الأسئلة
            <span style="
                position: absolute;
                bottom: 0;
                right: 0;
                width: 50%;
                height: 3px;
                background: linear-gradient(to right, #3498db, #1abc9c);
                border-radius: 3px;
            "></span>
        </h4>
        <button class="btn shadow-sm rounded-4 px-4 py-2" routerLink='/staff/admin/salah/questions/subjects'
            style="background: linear-gradient(90deg, #3498db, #1abc9c); color: #fff; border: none;">
            المواضيع
        </button>

    </div>

    <div class="dropdown text-end mb-3">
        <button
            class="btn px-4 py-2 rounded-pill shadow-sm text-white d-flex align-items-center justify-content-between"
            style="background-color: #A8DADC; border: none; min-width: 150px;" data-bs-toggle="dropdown"
            aria-expanded="false">
            <span class="fw-semibold">
                {{`المستوى ${selectedLevel}`  }}
            </span>
            <span class="ms-2" style="font-size: 0.9rem;">▼</span>
        </button>

        <ul class="dropdown-menu mt-2 rounded-4 shadow-sm text-end" style="min-width: 180px;">
            <li *ngFor="let level of levels">
                <a class="dropdown-item text-dark" (click)="selectLevel(level)">
                    {{ level.name }}
                </a>

            </li>
        </ul>
    </div>


    <div class="row">
        <div class="col-lg-12">
            <div class="">
                <div class="table-responsive">
                    <table class="table project-list-table table-nowrap align-middle table-borderless">
                        <thead>
                            <tr>
                                <th scope="col" class="ps-4">السؤال</th>
                                <th scope="col">التسلسل</th>
                                <th scope="col">ركن</th>
                                <th scope="col">الموضوع</th>
                                <th scope="col">المحور</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr (click)="toggleQuestionDetailsClick(i)"
                                *ngFor="let question of questions; let i = index">
                                <td class="ps-4" data-label="السؤال">{{ question.question }}
                                </td>
                                <td data-label="التسلسل">{{ question.sequence }}</td>
                                <td data-label="ركن">
                                    <i class="bx bx-md"
                                        [ngClass]="question.isPillar ? 'bx-check text-success' : 'bx-x text-danger'">
                                    </i>
                                </td>

                                <td data-label="الموضوع">{{ question.subject.name }}</td>
                                <td data-label="المحور">{{ question.area.name }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <button class="btn bg-ahlulbayt-green text-dark btn-lg rounded-circle position-fixed bottom-0 end-0 m-4"
        (click)="toggleAddQuestion()">+</button>
</div>

<app-question-details *ngIf="showQuestionDetails" [questionObject]="questionObject" [subjects]="subjects"
    [level]="level" (closeQuestionDetails)="toggleQuestionDetails()" (refreshList)="refreshList($event)">
</app-question-details>

<app-add-question *ngIf="showAddQuestion" [subjects]="subjects" [level]="level" (closeAddQuestion)="toggleAddQuestion()"
    (refreshList)="refreshList($event)">
</app-add-question>

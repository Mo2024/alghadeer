<div class="container" style="padding-top: 1.5rem;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 position-relative pb-2 fw-bold" style="color: #2c3e50;">
            التقارير
            <span style="
                position: absolute;
                bottom: 0;
                right: 0;
                width: 50%;
                height: 3px;
                background: linear-gradient(to right, #3498db, #2ecc71);
                border-radius: 3px;
                "></span>
        </h4>

    </div>
    <div class="login-wrapper">

        <form (ngSubmit)="onSubmit()" class="login-form text-center">

            <div class="form-group mb-4">
                <select class="minimalist-input" (ngModelChange)="onReportChange($event)" [(ngModel)]="report"
                    name="role">
                    <option [value]="''">اختر التقرير</option>
                    <option value="PHONE_NUMBERS_CLASSES">أرقام الهواتف و الصفوف</option>
                </select>
            </div>

            <div *ngIf="report === 'PHONE_NUMBERS_CLASSES'" class="form-group mb-4">
                <select class="minimalist-input" [(ngModel)]="semesterId" name="semesterId">
                    <option [value]="''">اختر الفصل</option>
                    <option *ngFor="let semester of semesters" [value]="semester.id">
                        {{ semester.name }}
                    </option>
                </select>
            </div>

            <button [disabled]="isDisabled" type="submit" class="btn-login w-75 rounded-pill">تحميل</button>
        </form>
    </div>
</div>

<div class="container py-4">
    <div class="row justify-content-center">

        <!-- Enrollment Card -->
        <div class="col-12 col-md-6">
            <div *ngIf="displayedEnrollment" class="card shadow-sm rounded-3 border-0">
                <div class="card-header text-center fw-bold bg-primary text-white">
                    تسجيل الفصل الدراسي
                </div>
                <div class="card-body">
                    <form>
                        <div class="mb-3">
                            <label for="grade" class="form-label fw-bold">الصف الدراسي</label>
                            <select class="form-select" [(ngModel)]="grade" name="grade">
                                <option [value]="''">اختر الصف</option>
                                <option value="FIRST">أول ابتدائي</option>
                                <option value="SECOND">ثاني ابتدائي</option>
                                <!-- other options -->
                            </select>
                        </div>

                        <div class="d-flex justify-content-center mt-3">
                            <button [disabled]="isDisabled" class="btn btn-success px-4 rounded-pill" type="submit"
                                (click)="enrollToSemester()">
                                تسجيل الفصل
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-12 col-md-6 d-flex justify-content-center">

            <div class="attendance-gauge text-center p-4 rounded-4 shadow-lg">
                <h5 class="fw-bold mb-4 text-dark">نسبة حضور الطالب 📊</h5>
                <ngx-gauge [value]="attendanceValue" [type]="'full'" [thick]="14" [cap]="'round'"
                    [foregroundColor]="attendanceColor" [backgroundColor]="'#f0f0f0'" [size]="240">
                    <ngx-gauge-value>
                        <span class="fw-bold fs-2" [style.color]="attendanceColor">
                            {{ getArabicNumber(attendanceValue) }}%
                        </span>
                    </ngx-gauge-value>
                    <ngx-gauge-label>
                        <span class="text-muted fs-6">إجمالي الحضور</span>
                    </ngx-gauge-label>
                </ngx-gauge>

            </div>

        </div>
    </div>
</div>

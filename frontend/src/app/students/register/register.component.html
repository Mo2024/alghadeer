<div class="full-height mt-5">
    <div class="student-form-wrapper-container">
        <div class="student-form-wrapper">
            <form (ngSubmit)="onSubmit()">
                <h2>تسجيل الطالب</h2>

                <input type="text" [(ngModel)]="name" name="name" class="minimalist-input" placeholder="إسم الطالب">
                <input type="text" [(ngModel)]="area" name="area" class="minimalist-input" placeholder="المنطقة">
                <input type="text" pattern="^\d{9}$" maxlength="9" [(ngModel)]="cpr" name="cpr" class="minimalist-input"
                    placeholder="الرقم الشخصي">
                <input type="text" pattern="^\d{8}$" maxlength="8" [(ngModel)]="firstTelephone" name="firstTelephone"
                    class="minimalist-input" placeholder="رقم الهاتف الأول">

                <input type="text" pattern="^\d{8}$" maxlength="8" [(ngModel)]="secondTelephone" name="secondTelephone"
                    class="minimalist-input" placeholder="رقم الهاتف الثاني (اختياري)">


                <input type="text" [(ngModel)]="email" name="email" class="minimalist-input"
                    placeholder="البريد الإلكتروني">
                <div class="minimalist-date">
                    <input type="text" [(ngModel)]="dateOfBirth" name="dateOfBirth" class="minimalist-input"
                        placeholder="تاريخ الميلاد" [matDatepicker]="picker" (click)="picker.open()" readonly>
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </div>


                <div style="margin-bottom:1rem; display:flex; align-items:center; gap:0.5rem;">
                    <button type="button" (click)="fileInput.click()" class="btn-file rounded-pill">
                        الصورة الشخصية (اختياري)
                    </button>
                    <input type="file" accept="image/png, image/jpeg" (change)="onFileSelected($event)" id="image"
                        style="display:none" #fileInput>
                    <span class="file-info">{{ selectedFileName || 'لم يتم اختيار ملف' }}</span>
                </div>


                <button [disabled]="isDisabled" type="submit" class="btn-submit w-75 rounded-pill mx-auto d-block">
                    تسجيل الدخول
                </button>
            </form>
        </div>
    </div>
</div>

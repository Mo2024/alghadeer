spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=${FAIL_TIMEOUT}
#In prod make ddl false and ddl-auto none
spring.jpa.generate-ddl=${DDL_GENERATION}
spring.jpa.hibernate.ddl-auto=${DDL_STATUS}
spring.flyway.enabled=${FLYWAY_STATUS}



services:
  frontend:
    image: mohdosama2002/alghadeer-frontend:latest
    container_name: frontend
    restart: always
    ports:
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - alghadeer-network

  backend:
    image: mohdosama2002/alghadeer-backend:latest
    container_name: backend
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    volumes:
      - /opt/students-images:/tmp/students-images
      - /var/log/alghadeer:/tmp/logs
    networks:
      - alghadeer-network

networks:
  alghadeer-network:
    driver: bridge